name: Deploy Atlas Operativo to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci --include=optional


      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Repair Quartz community utils
        run: |
          if [ ! -f node_modules/@quartz-community/utils/dist/index.js ]; then
            echo "Repairing @quartz-community/utils..."
            rm -rf /tmp/quartz-utils
            git init /tmp/quartz-utils
            git -C /tmp/quartz-utils remote add origin https://github.com/quartz-community/utils.git
            git -C /tmp/quartz-utils fetch --depth 1 origin e09d8b0bbccb46073b23c00affaf3e40a2c3b0c4
            git -C /tmp/quartz-utils checkout --detach FETCH_HEAD

            mkdir -p node_modules/@quartz-community/utils/dist
            cp -R /tmp/quartz-utils/dist/. node_modules/@quartz-community/utils/dist/
          fi

          test -f node_modules/@quartz-community/utils/dist/index.js
          echo "Quartz utils OK"

      - name: Build Quartz
        run: npx quartz build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
